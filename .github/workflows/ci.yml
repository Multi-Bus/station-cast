name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -c constraints.txt -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy src

      - name: Test (pytest)
        run: pytest

      - name: Check OpenAPI spec is frozen (docs/openapi.json)
        run: |
          python scripts/export_openapi.py
          git diff --exit-code docs/openapi.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # data/processed/ is no longer committed (it is 158MB at
      # STATIONCAST_SCOPE=seoul -- see data/README.md §11), and the real
      # pipeline needs raw files behind a login. The smoke set uses the
      # corridor's real stop IDs with made-up values, which is enough for the
      # endpoint check below and is what the Dockerfile's COPY picks up.
      - name: Build smoke data into the build context
        run: |
          pip install -c constraints.txt .
          python scripts/build_smoke_data.py

      - name: Build image
        run: docker build -t station-cast:ci .

      - name: Run the image -- every endpoint must answer
        run: |
          docker run -d --rm -p 8000:8000 --name station-cast-smoke station-cast:ci
          for i in $(seq 1 10); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          fail=0
          for path in / /api/stops /api/corridor /api/stops/101000021/timeline \
                      /api/stops/101000021/congestion "/api/stops/101000021/context?date=20260105" \
                      /api/stops/101000021/arrivals; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8000$path")
            echo "$path -> $status"
            [ "$status" = "200" ] || fail=1
          done
          docker logs station-cast-smoke
          docker stop station-cast-smoke
          exit $fail

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build
