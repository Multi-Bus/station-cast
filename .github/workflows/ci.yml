name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -c constraints.txt -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy src

      - name: Test (pytest)
        run: pytest

      - name: Check OpenAPI spec is frozen (docs/openapi.json)
        run: |
          python scripts/export_openapi.py
          git diff --exit-code docs/openapi.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build

  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install fosslight_dependency
        run: pip install fosslight_dependency

      - name: Scan dependency licenses (Python)
        run: fosslight_dependency -p . -m pypi -o license-report.csv -f csv

      - name: Check forbidden licenses (Python, docs/LICENSE_POLICY.md)
        run: python scripts/check_licenses.py license-report.csv

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Only covers frontend/package.json's direct dependencies -- the npm
      # scanner mode doesn't walk the full transitive tree the way -m pypi
      # does. Full node_modules (72 packages) was checked manually when this
      # step was added: 0 forbidden licenses.
      - name: Scan dependency licenses (npm)
        run: fosslight_dependency -p frontend -m npm -o license-report-npm.csv -f csv

      - name: Check forbidden licenses (npm, docs/LICENSE_POLICY.md)
        run: python scripts/check_licenses.py license-report-npm.csv

      - name: Upload license reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: |
            license-report.csv
            license-report-npm.csv

      - name: Cache ScanCode Toolkit license index
        uses: actions/cache@v4
        with:
          path: ~/.cache/scancode-tk
          key: scancode-tk-${{ runner.os }}

      - name: Install ScanCode Toolkit
        run: pip install scancode-toolkit

      # check_licenses.py is excluded: it contains forbidden-license names as
      # string literals (its own FORBIDDEN_KEYWORDS list), which ScanCode's
      # text matcher always flags as a false positive — not embedded license text.
      - name: Scan source files for embedded licenses
        run: |
          scancode --license --json-pp scancode-source-report-src.json --ignore "*.egg-info/*" --ignore "__pycache__/*" src
          scancode --license --json-pp scancode-source-report-scripts.json --ignore "check_licenses.py" scripts
          scancode --license --json-pp scancode-source-report-tests.json tests

      - name: Check source files for embedded licenses (docs/LICENSE_POLICY.md)
        run: >
          python scripts/check_source_licenses.py
          scancode-source-report-src.json
          scancode-source-report-scripts.json
          scancode-source-report-tests.json

      - name: Upload source license scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scancode-source-report
          path: scancode-source-report-*.json

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project (prod deps only -- SBOM should reflect what ships)
        run: pip install -c constraints.txt .

      - name: Install cyclonedx-bom
        run: pip install cyclonedx-bom

      - name: Generate Python SBOM
        run: cyclonedx-py environment -o sbom-python.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate npm SBOM
        working-directory: frontend
        run: npx @cyclonedx/cyclonedx-npm --output-file ../sbom-npm.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom-python.json
            sbom-npm.json
